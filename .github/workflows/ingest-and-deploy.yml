name: Collect intelligence and deploy

on:
  schedule:
    - cron: '50 * * * *'
      timezone: Europe/London
    - cron: '5,20,35 * * * *'
      timezone: Europe/London
  workflow_dispatch:
    inputs:
      collect:
        description: Collect new notices before deployment
        type: boolean
        default: true
      full_tests:
        description: Force the full desktop and mobile regression suite
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore: ['data/**', '**.md']

concurrency:
  group: anthrion-signal-production
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      deploy: ${{ steps.changed.outputs.deploy }}
      signature: ${{ steps.changed.outputs.signature }}
    steps:
      - name: Create company automation token
        if: github.repository == 'Anthrion/anthrion-signal'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.ANTHRION_APP_CLIENT_ID }}
          private-key: ${{ secrets.ANTHRION_APP_PRIVATE_KEY }}
          owner: Anthrion
          repositories: anthrion-signal
          permission-contents: write
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}
      - name: Set automation commit identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          name='github-actions[bot]'
          id='41898282'
          if [ -n "$APP_SLUG" ]; then
            name="$APP_SLUG[bot]"
            id=$(gh api "users/$name" --jq '.id')
          fi
          echo "SIGNAL_GIT_NAME=$name" >> "$GITHUB_ENV"
          echo "SIGNAL_GIT_EMAIL=$id+$name@users.noreply.github.com" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[test]'
      - name: Plan collection and verification
        id: plan
        env:
          COLLECT_REQUESTED: ${{ inputs.collect }}
          FORCE_FULL_TESTS: ${{ inputs.full_tests }}
          SCHEDULE_TRIGGER: ${{ github.event.schedule }}
        run: python scripts/refresh_plan.py plan
      - name: Save previous publication signature
        run: python scripts/publication_state.py before
      - name: Collect public opportunities
        id: collect
        if: steps.plan.outputs.collect == 'true'
        env:
          MAX_PAGES_PER_SOURCE: '80'
          PYTHONUNBUFFERED: '1'
        run: python -m anthrion_signal.cli ingest --no-export
      - name: Compress retained snapshots
        run: python scripts/compress_retained_data.py
      - name: Translate new and outstanding records
        id: translate
        # A free model can still be billed when the Google project is on a paid tier.
        # Confirm the existing project's free tier before enabling calls after transfer.
        if: github.repository != 'Anthrion/anthrion-signal' || vars.SIGNAL_GEMINI_FREE_TIER_CONFIRMED == 'true'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: '1'
        run: python scripts/translate_records.py records --github-checkpoint --max-calls 150 --max-seconds 300
      - name: Checkpoint private translation progress
        if: always() && steps.translate.outcome != 'skipped'
        continue-on-error: true
        run: |
          git config user.name "$SIGNAL_GIT_NAME"
          git config user.email "$SIGNAL_GIT_EMAIL"
          git add -- data/translation data/translation_quota.json
          if ! git diff --cached --quiet; then
            python scripts/automation_git_guard.py staged
            git commit -m 'Checkpoint static English translations [skip ci]'
            python scripts/automation_git_guard.py unpushed
            git push origin HEAD:main
          fi
      - name: Validate pipeline and public dataset
        run: |
          python -m anthrion_signal.cli validate
          python -m anthrion_signal.cli export
          python scripts/check_public_output.py
          python scripts/audit_translations.py
      - name: Detect meaningful publication changes
        id: changed
        env:
          FORCE_DEPLOY: ${{ github.event_name != 'schedule' }}
        run: python scripts/publication_state.py after
      - name: Verify pipeline changes
        if: steps.plan.outputs.full_tests == 'true'
        run: |
          python -m pytest -q
          python -m ruff check pipeline scripts/refresh_plan.py scripts/translate_records.py scripts/publication_state.py scripts/reconcile_release_data.py scripts/audit_translations.py scripts/audit_relevance.py scripts/automation_git_guard.py scripts/timestamp_source.py scripts/compress_retained_data.py
      - uses: actions/setup-node@v4
        if: steps.changed.outputs.deploy == 'true' || steps.plan.outputs.full_tests == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        if: steps.changed.outputs.deploy == 'true' || steps.plan.outputs.full_tests == 'true'
        working-directory: app
      - name: Test and build dashboard
        if: steps.changed.outputs.deploy == 'true' || steps.plan.outputs.full_tests == 'true'
        working-directory: app
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          npm test
          npm run build
      - name: Install browser
        if: steps.changed.outputs.deploy == 'true' || steps.plan.outputs.full_tests == 'true'
        working-directory: app
        run: npx playwright install --with-deps chromium
      - name: Full browser regression against production build
        if: steps.plan.outputs.full_tests == 'true'
        working-directory: app
        env:
          SIGNAL_TEST_PREVIEW: 'true'
        run: npx playwright test
      - name: Data refresh desktop and mobile smoke tests
        if: steps.changed.outputs.deploy == 'true' && steps.plan.outputs.full_tests != 'true'
        working-directory: app
        env:
          SIGNAL_TEST_PREVIEW: 'true'
        run: npx playwright test data-refresh.spec.ts
      - name: Record successful full regression
        if: steps.plan.outputs.full_tests == 'true'
        run: python scripts/refresh_plan.py passed
      - name: Persist canonical state
        # Publication is still gated on every required check above.
        run: |
          git config user.name "$SIGNAL_GIT_NAME"
          git config user.email "$SIGNAL_GIT_EMAIL"
          git add data
          if ! git diff --cached --quiet; then
            python scripts/automation_git_guard.py staged
            git commit -m 'Update public opportunity intelligence [skip ci]'
            git pull --rebase origin main
            python scripts/automation_git_guard.py unpushed
            git push origin HEAD:main
          fi
      - name: Upload Pages build
        if: steps.changed.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist
          retention-days: 1
      - name: Record run summary
        if: always()
        env:
          COLLECTION_OUTCOME: ${{ steps.collect.outcome }}
          TRANSLATION_OUTCOME: ${{ steps.translate.outcome }}
        run: python scripts/run_summary.py
      - name: Preserve failed browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-${{ github.run_id }}
          path: app/test-results/
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  record-publication:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create company automation token
        id: app-token
        if: github.repository == 'Anthrion/anthrion-signal'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.ANTHRION_APP_CLIENT_ID }}
          private-key: ${{ secrets.ANTHRION_APP_PRIVATE_KEY }}
          owner: Anthrion
          repositories: anthrion-signal
          permission-contents: write
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}
      - name: Set automation commit identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          name='github-actions[bot]'
          id='41898282'
          if [ -n "$APP_SLUG" ]; then
            name="$APP_SLUG[bot]"
            id=$(gh api "users/$name" --jq '.id')
          fi
          echo "SIGNAL_GIT_NAME=$name" >> "$GITHUB_ENV"
          echo "SIGNAL_GIT_EMAIL=$id+$name@users.noreply.github.com" >> "$GITHUB_ENV"
      - name: Record successful publication
        env:
          DEPLOYED_SIGNATURE: ${{ needs.build.outputs.signature }}
        run: |
          python scripts/publication_state.py deployed
          git config user.name "$SIGNAL_GIT_NAME"
          git config user.email "$SIGNAL_GIT_EMAIL"
          git add data/publication_state.json
          if ! git diff --cached --quiet; then
            python scripts/automation_git_guard.py staged
            git commit -m 'Record successful intelligence publication [skip ci]'
            git pull --rebase origin main
            python scripts/automation_git_guard.py unpushed
            git push origin HEAD:main
          fi
