name: Publish verified Signal release
on:
  workflow_call:
    inputs:
      full_tests:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    # Match the PR browser runner and its preinstalled Chromium libraries.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      EXECUTION_WORKFLOW_SHA: ${{ github.workflow_sha }}
      VITE_BASE_PATH: /${{ github.event.repository.name }}/
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    # Hold one short lock through compilation, checks, deploy and its receipt.
    concurrency:
      group: anthrion-signal-publication
      cancel-in-progress: false
      queue: max
    permissions:
      actions: read
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # Keep commit ancestry; fetch old data blobs only if a check needs them.
          filter: blob:none
          persist-credentials: false
      - name: Select latest compatible validated export
        id: data
        run: python scripts/release_bundle.py select
      - name: Plan publication
        if: steps.data.outputs.eligible == 'true'
        id: plan
        env:
          FORCE_FULL_TESTS: ${{ inputs.full_tests }}
        run: python scripts/release_bundle.py publish-plan
      - uses: actions/setup-node@v4
        if: steps.plan.outputs.deploy == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dashboard dependencies
        if: steps.plan.outputs.deploy == 'true'
        working-directory: app
        run: npm ci
      - name: Set up and check the test browser
        if: steps.plan.outputs.deploy == 'true'
        uses: ./.github/actions/setup-browser
      - name: Restore validated export
        id: cache
        if: steps.plan.outputs.deploy == 'true'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: tmp/public-data.tar.gz
          key: ${{ steps.data.outputs.key }}
      - name: Verify cache or download durable export
        if: steps.plan.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_storage.py ensure-public
      - name: Verify and unpack public data
        if: steps.plan.outputs.deploy == 'true'
        run: python scripts/release_bundle.py restore
      - name: Test and build dashboard
        if: steps.plan.outputs.deploy == 'true'
        working-directory: app
        run: |
          npm test
          npm run build
      - name: UI desktop and mobile regression
        if: steps.plan.outputs.deploy == 'true' && steps.plan.outputs.full_ui == 'true'
        working-directory: app
        env:
          SIGNAL_TEST_PREVIEW: 'true'
          UI_TEST_SUITE: ${{ inputs.full_tests == true && 'test:e2e:ui' || 'test:e2e:pr' }}
        run: npm run "$UI_TEST_SUITE"
      - name: Published-data desktop and mobile integration
        if: steps.plan.outputs.deploy == 'true'
        working-directory: app
        env:
          SIGNAL_TEST_PREVIEW: 'true'
          DATA_TEST_SUITE: ${{ inputs.full_tests == true && 'test:e2e:data' || 'test:e2e:data:smoke' }}
        run: npm run "$DATA_TEST_SUITE"
      - name: Upload tested Pages build
        if: steps.plan.outputs.deploy == 'true'
        id: pages-artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: app/dist
          retention-days: 1
      - name: Verify Pages artifact is visible
        if: steps.plan.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.pages-artifact.outputs.artifact_id }}
        run: python scripts/wait_pages_artifact.py
      - name: Deploy GitHub Pages
        if: steps.plan.outputs.deploy == 'true'
        id: deployment
        # Pages keys the deployment by the workflow SHA. An immediate retry
        # reuses the cancelled deployment ID and can wait another ten minutes.
        # A later publication can reuse the validated export from Release storage.
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
      - name: Create publication receipt token
        if: >-
          steps.deployment.outcome == 'success' &&
          github.repository_owner == 'Anthrion' && vars.ANTHRION_APP_CLIENT_ID != ''
        id: receipt-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.ANTHRION_APP_CLIENT_ID }}
          private-key: ${{ secrets.ANTHRION_APP_PRIVATE_KEY }}
          owner: Anthrion
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Record successful publication
        if: steps.deployment.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.receipt-token.outputs.token || github.token }}
          APP_SLUG: ${{ steps.receipt-token.outputs.app-slug }}
        run: |
          name='github-actions[bot]'
          id='41898282'
          if [ -n "$APP_SLUG" ]; then
            name="$APP_SLUG[bot]"
            id=$(gh api "users/$name" --jq '.id')
          fi
          git config user.name "$name"
          git config user.email "$id+$name@users.noreply.github.com"
          gh auth setup-git --hostname github.com
          python scripts/release_bundle.py record
          git add -- data/publication_state.json data/published_release.json data/ui_verification_state.json
          if ! git diff --cached --quiet; then
            python scripts/automation_git_guard.py staged
            git commit -m 'Record successful intelligence publication [skip ci]'
            python scripts/push_data.py
          fi
      - name: Preserve failed browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-${{ github.run_id }}
          path: app/test-results/
          if-no-files-found: ignore
          retention-days: 3
