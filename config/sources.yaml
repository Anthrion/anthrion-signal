  - id: ted
    name: TED Europe
    enabled: true
    collector: ted
    source_type: official_notice
    url: https://api.ted.europa.eu/v3/notices/search
    website: https://ted.europa.eu
    docs: https://docs.ted.europa.eu/ODS/latest/reuse/search-api.html
    limit: 200
    country: EU
    countries: [IT, SE, FI, DK, 'NO', IS, DE, ES, GR, BE, NL, FR, CH, AT, IE, PT, PL, EE, LV, LT, CZ, RO, BG, HR, HU, LU, CY, MT, SI, SK]
