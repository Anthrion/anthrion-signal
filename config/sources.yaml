  # North American and remaining European research registry; assessed 2026-09-21.
  # These entries add no collected coverage. See docs/north-america-sources-2026-09-21.md
  # before enabling any of them, and note that four are recorded as refusals rather than gaps.
  - {id: seao_qc, name: SEAO (Quebec), enabled: false, collector: external_adapter, website: 'https://www.donneesquebec.ca', access: weekly OCDS 1.1 release packages without authentication under CC-BY 4.0 which permits commercial redistribution; UNSPSC-coded and notices included; the weekly files are deltas rather than snapshots so releases must be accumulated per ocid and expired on tenderPeriod.endDate; French only and up to seven days of latency}
  - {id: sasktenders, name: SaskTenders (Saskatchewan), enabled: false, collector: external_adapter, website: 'https://www.sasktenders.ca', access: NEEDS WRITTEN PERMISSION - no robots.txt, no auth and fully expanded records inline, but no licence grant exists anywhere on the site so Crown copyright applies by default; ask SaskBuilds and Procurement before collecting}
  - {id: ns_tenders, name: Nova Scotia awarded tenders, enabled: false, collector: external_adapter, website: 'https://data.novascotia.ca', access: keyless Socrata SODA2 with a changed-since cursor on awarded_date, but awards only and the OGL_NOVA_SCOTIA licence text is unreachable so reuse is unverified; open notices sit behind an F5 WAF that returns Request Rejected as HTTP 200}
  - {id: bcbid, name: BC Bid, enabled: false, collector: external_adapter, website: 'https://www.bcbid.gov.bc.ca', access: BLOCKED - robots.txt disallows everything and public browse requires an Ivalua CAPTCHA; the only relevant catalogue dataset is licensed Access Only, which does not permit reproduction without written permission}
  - {id: alberta_apc, name: Alberta Purchasing Connection, enabled: false, collector: external_adapter, website: 'https://purchasing.alberta.ca', access: BLOCKED - robots.txt allows only four named search engines; an undocumented anonymous opportunity search endpoint is reachable and discloses its own contract but returned HTTP 500 with an empty body to every well-formed payload}
  - {id: ontario_tenders, name: Ontario Tenders Portal, enabled: false, collector: external_adapter, website: 'https://ontariotenders.app.jaggaer.com', access: BLOCKED - the Jaggaer robots.txt disallows /esop, which is the entire application; data.ontario.ca holds no tender notices and Supply Ontario offers only per-vendor email alerts}
  - {id: merx, name: MERX, enabled: false, collector: external_adapter, website: 'https://www.merx.com', access: DO NOT CRAWL - robots.txt names anthropic-ai, ClaudeBot and Claude-Web under Disallow / and closes /ws/ to every agent; carries Manitoba tendering. The terms of use were deliberately not read, and RFC 9309 distinguishes robots rules from access authorisation, so whether an authorised route exists is unresolved rather than excluded. A paid subscription used within its terms or a written data agreement remains the route to investigate; establish any third-party reseller's right to supply the data before relying on one}
  - {id: bids_and_tenders, name: bids&tenders, enabled: false, collector: external_adapter, website: 'https://opportunities.bidsandtenders.com', access: NOT USABLE - a keyless embed returns about 1000 open opportunities as server-rendered HTML, but robots.txt disallows the paging endpoint and terms clause 13 prohibits automated extraction for commercial purposes; covers much Ontario municipal volume so a GHD data agreement is the realistic route}
  - {id: bzp_pl, name: BZP e-Zamowienia (Poland), enabled: false, collector: external_adapter, website: 'https://ezamowienia.gov.pl', access: keyless notice API at mo-board/api/v1/notice carrying about 404 notices a day that are effectively all below EU threshold; PageSize caps at 500 with no pagination parameter so truncation is a silent 200 and must be asserted, and CpvCode is a substring rather than prefix match giving about 34 per cent precision; free to use with no affirmative reuse grant}
  - {id: kommers_annons, name: Kommers Annons (Sweden), enabled: false, collector: external_adapter, website: 'https://www.kommersannons.se', access: NEEDS WRITTEN PERMISSION - about 70 IT notices a year of genuine below-threshold coverage and robots.txt allows everything, but the eLite terms at /elite/Info/TermsOfUse.aspx section 3.4 require the operator's prior written approval for systematic automated extraction unless expressly permitted via an API or designated interface; section 3.3 permits passing public information to third parties free of charge while forbidding resale without approval, and section 5.4 governs attribution. CPV arrives as Swedish text labels needing a label-to-code map}
  - {id: mercell_se, name: Mercell annonsdatabas (Sweden), enabled: false, collector: external_adapter, website: 'https://app.mercell.com', access: NEEDS WRITTEN PERMISSION - the widest Swedish below-threshold coverage at about 361 IT notices a year, and robots.txt allows everything with a nightly notice sitemap, but there is no public API and Terms of Use section 2.5 forbids crawling and automated downloading of information. Konkurrensverket dnr 880/2024 enforces free access for people, not for machines}
  - {id: e_avrop, name: e-Avrop (Sweden), enabled: false, collector: external_adapter, website: 'https://www.e-avrop.com', access: NOT USABLE - robots.txt disallows everything and the Pabliq terms forbid building parallel databases, although the operator states that searching notices is free of charge; about 1400 live notices}
  - {id: texas_esbd, name: Texas ESBD, enabled: false, collector: external_adapter, website: 'https://www.txsmartbuy.gov', access: NEEDS WRITTEN PERMISSION - a good keyless JSON search over about 62000 records, but robots.txt disallows everything; ask Texas Comptroller of Public Accounts}
  - {id: virginia_eva, name: Virginia eVA, enabled: false, collector: external_adapter, website: 'https://mvendor.cgieva.com', access: NEEDS WRITTEN PERMISSION - an open Solr index of about 292000 documents with a real lastupdatedate cursor, but robots.txt disallows everything; ask Virginia Department of General Services}
  - {id: comprasmx, name: ComprasMX (Mexico), enabled: false, collector: external_adapter, website: 'https://buengobierno.gob.mx', access: NOT USABLE - an undocumented keyless bulk CSV of about 73000 rows exists, but gob.mx terms authorise personal non-commercial use only and expressly forbid public or commercial distribution; descriptions are also too short for delivery matching and federal OCDS is abandoned}
