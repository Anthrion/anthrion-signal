version: "1.0"
sources:
  - id: find_tender
    name: Find a Tender
    enabled: true
    collector: ocds_cursor
    source_type: official_notice
    url: https://www.find-tender.service.gov.uk/api/1.0/ocdsReleasePackages
    website: https://www.find-tender.service.gov.uk
    docs: https://www.find-tender.service.gov.uk/apidocumentation/1.0/GET-ocdsReleasePackages
    record_url: https://www.find-tender.service.gov.uk/api/1.0/ocdsRecordPackages/{ocid}
    hydrate_records: true
    record_limit: 4
    from_param: updatedFrom
    to_param: updatedTo
    date_format: '%Y-%m-%dT%H:%M:%S'
    stages: [planning, tender, award]
    limit: 100
    overlap_minutes: 30
    window_hours: 6
    country: GB
  - id: contracts_finder
    name: Contracts Finder
    enabled: true
    collector: ocds_cursor
    source_type: official_notice
    url: https://www.contractsfinder.service.gov.uk/Published/Notices/OCDS/Search
    website: https://www.contractsfinder.service.gov.uk
    docs: https://www.contractsfinder.service.gov.uk/apidocumentation
    record_url: https://www.contractsfinder.service.gov.uk/Published/OCDS/Record/{ocid}
    hydrate_records: true
    record_limit: 4
    from_param: publishedFrom
    to_param: publishedTo
    stages: [planning, tender, award, implementation]
    limit: 100
    overlap_minutes: 60
    window_hours: 24
    country: GB
  - id: scotland
    name: Public Contracts Scotland
    enabled: true
    collector: ocds_monthly
    source_type: official_notice
    url: https://api.publiccontractsscotland.gov.uk/v1/Notices
    website: https://www.publiccontractsscotland.gov.uk
    docs: https://api.publiccontractsscotland.gov.uk/v1
    record_url: https://api.publiccontractsscotland.gov.uk/v1/Notice?id={ocid}
    notice_types: [1, 2, 3, 4, 5, 6, 7, 14, 20, 101, 102, 103, 104]
    recent_months: 2
    country: GB
    region: Scotland
  - id: wales
    name: Sell2Wales
    enabled: true
    collector: ocds_monthly
    source_type: official_notice
    url: https://api.sell2wales.gov.wales/v1/Notices
    fallback_url: https://www.sell2wales.gov.wales/Search/Search_mainpage.aspx
    website: https://www.sell2wales.gov.wales
    docs: https://www.sell2wales.gov.wales/helpandresources/ocds/publicationpolicy
    record_url: https://api.sell2wales.gov.wales/v1/Notice?id={ocid}&locale=2057
    notice_types: [1, 2, 3, 4, 5, 6, 7, 14, 20, 51, 52, 53]
    recent_months: 2
    locale: 2057
    country: GB
    region: Wales
  - id: govuk
    name: GOV.UK
    enabled: true
    collector: govuk
    source_type: official_publication
    url: https://www.gov.uk/api/search.json
    website: https://www.gov.uk
    docs: https://www.gov.uk/search/research-and-statistics
    country: GB
    limit: 100
  - id: digital_outcomes
    name: Digital Outcomes
    enabled: true
    collector: digital_outcomes
    source_type: official_notice
    url: https://redirect.contractawardservice.gca.gov.uk/digital-outcomes/opportunities
    website: https://redirect.contractawardservice.gca.gov.uk
    docs: https://redirect.contractawardservice.gca.gov.uk/digital-outcomes/opportunities
    country: GB
    request_delay_seconds: 1
  - id: upcoming_agreements
    name: GCA Upcoming Agreements
    enabled: true
    collector: upcoming_agreements
    source_type: official_publication
    url: https://www.gca.gov.uk/agreements/upcoming
    website: https://www.gca.gov.uk
    docs: https://www.gca.gov.uk/agreements/upcoming
    country: GB
    request_delay_seconds: 1
  - id: ted
    name: TED Europe
    enabled: true
    collector: ted
    source_type: official_notice
    url: https://api.ted.europa.eu/v3/notices/search
    website: https://ted.europa.eu
    docs: https://docs.ted.europa.eu/ODS/latest/reuse/search-api.html
    limit: 200
    country: EU
    countries: [IT, SE, FI, DK, 'NO', IS, DE, ES, GR, FR, BE, NL, LU, AT, CH]
    coverage: European public notices published on TED; national-only notices are not included.
  - id: usaspending
    name: USAspending
    enabled: false
    collector: usaspending
    source_type: official_award
    url: https://api.usaspending.gov/api/v2/search/spending_by_award/
    website: https://www.usaspending.gov
    docs: https://api.usaspending.gov/docs/endpoints
    country: US
    coverage: Federal contract awards and incumbent intelligence, not open tenders. Values are award obligations.
    keywords: [Salesforce, MuleSoft, Agentforce, customer relationship management, generative AI, digital transformation]
    lookback_days: 90
    limit: 100
  - id: germany
    name: German Public Procurement
    enabled: true
    collector: german_daily
    source_type: official_notice
    url: https://oeffentlichevergabe.de/api/notice-exports
    website: https://oeffentlichevergabe.de
    docs: https://oeffentlichevergabe.de/documentation/api/opendata
    country: DE
    initial_lookback_days: 7
    max_days_per_run: 3
    record_url: https://oeffentlichevergabe.de/ui/de/notices/{ocid}
    coverage: Completed daily national and EU notice exports, with original eForms submission deadlines.
  - id: spain
    name: Spanish Public Procurement
    enabled: true
    collector: spain_atom
    source_type: official_notice
    url: https://contrataciondelsectorpublico.gob.es/sindicacion/sindicacion_643/licitacionesPerfilesContratanteCompleto3.atom
    website: https://contrataciondelsectorpublico.gob.es
    docs: https://www.hacienda.gob.es/es-ES/GobiernoAbierto/Datos%20Abiertos/Paginas/LicitacionesContratante.aspx
    country: ES
    initial_lookback_days: 7
    max_pages_per_run: 3
    coverage: PLACSP contracting profiles excluding minor contracts. Source-local deadlines without an offset require notice verification.
  - id: nyc_city_record
    name: NYC City Record
    enabled: true
    collector: nyc_city_record
    source_type: official_notice
    url: https://data.cityofnewyork.us/resource/dg92-zbpx.json
    website: https://a856-cityrecord.nyc.gov
    docs: https://data.cityofnewyork.us/City-Government/City-Record-Online/dg92-zbpx
    country: US
    limit: 200
    max_pages_per_run: 6
    refresh_hours: 24
    coverage: New York City procurement notices, including open solicitations and subsequent status changes.
  - id: la_ramp
    name: Los Angeles RAMP
    enabled: true
    collector: la_ramp
    source_type: official_notice
    url: https://data.lacity.org/resource/hf3r-utnq.json
    metadata_url: https://data.lacity.org/api/views/hf3r-utnq.json
    website: https://www.rampla.org
    docs: https://catalog.data.gov/dataset/ramp-open-bid-opportunities
    country: US
    refresh_hours: 24
    allow_task_orders: false
    coverage: Official open bid listings. Task-order-only routes are excluded until participation rights are confirmed; full terms remain in the original notice.
  - id: grants
    name: Grants.gov
    enabled: true
    collector: grants
    source_type: official_funding
    url: https://api.grants.gov/v1/api/search2
    detail_url: https://api.grants.gov/v1/api/fetchOpportunity
    website: https://www.grants.gov
    docs: https://www.grants.gov/api/api-guide
    country: US
    coverage: Federal funding and forecast opportunities. Applicant eligibility and local submission times must be checked in the source announcement.
    keywords: ['"artificial intelligence"', '"digital transformation"', '"customer relationship management"']
  - {id: etenders_ni, name: eTendersNI, enabled: false, collector: external_adapter, website: 'https://etendersni.gov.uk', access: official API or supplier alerts}
  - {id: nhs_atamis, name: NHS Atamis, enabled: false, collector: external_adapter, website: 'https://health-family.force.com/s/Welcome', access: supplier alerts}
  - {id: nhs_supply_chain, name: NHS Supply Chain / Jaggaer, enabled: false, collector: external_adapter, website: 'https://www.supplychain.nhs.uk', access: official feed or supplier alerts}
  - {id: mod_dsp, name: MOD Defence Sourcing Portal, enabled: false, collector: external_adapter, website: 'https://contracts.mod.uk', access: supplier alerts}
  - {id: mod_pipeline, name: MOD Acquisition Pipeline, enabled: false, collector: external_adapter, website: 'https://www.gov.uk/government/organisations/ministry-of-defence', access: documented public export}
  - {id: chest, name: The Chest, enabled: false, collector: external_adapter, website: 'https://www.the-chest.org.uk', access: supplier alerts}
  - {id: yortender, name: YORtender, enabled: false, collector: external_adapter, website: 'https://yortender.eu-supply.com', access: supplier alerts}
  - {id: procontract, name: ProContract / Proactis, enabled: false, collector: external_adapter, website: 'https://procontract.due-north.com', access: authorised API or supplier alerts}
  - {id: intend, name: In-tend, enabled: false, collector: external_adapter, website: 'https://www.in-tend.co.uk', access: supplier alerts}
  - {id: jaggaer, name: Jaggaer buyer portals, enabled: false, collector: external_adapter, website: 'https://www.jaggaer.com', access: supplier alerts}
  - {id: innovate_uk, name: Innovate UK, enabled: false, collector: external_adapter, website: 'https://apply-for-innovation-funding.service.gov.uk', access: official competition feed}
  - {id: sbri, name: SBRI, enabled: false, collector: external_adapter, website: 'https://www.ukri.org', access: official competition feed}
  - {id: eu_funding, name: EU Funding & Tenders, enabled: false, collector: external_adapter, website: 'https://ec.europa.eu/info/funding-tenders/opportunities/portal', access: documented public API}
  - {id: nato, name: NATO Procurement, enabled: false, collector: external_adapter, website: 'https://www.nato.int', access: official public procurement feed}
  - {id: ncia, name: NCIA, enabled: false, collector: external_adapter, website: 'https://www.ncia.nato.int', access: official opportunities export}
  - {id: nspa, name: NSPA, enabled: false, collector: external_adapter, website: 'https://www.nspa.nato.int', access: authorised feed}
  - {id: world_bank, name: World Bank, enabled: false, collector: external_adapter, website: 'https://projects.worldbank.org', access: official procurement API}
  - {id: ebrd, name: EBRD, enabled: false, collector: external_adapter, website: 'https://www.ebrd.com', access: official procurement notices}
  - {id: sam, name: SAM.gov, enabled: false, collector: external_adapter, website: 'https://sam.gov', access: API key and official opportunities API}
  # Below-EU-threshold national coverage for the markets TED only serves above threshold.
  # Assessed 2026-09-18; see docs/free-apis-market-expansion-2026-09-18.md before enabling.
  - {id: tenderned, name: TenderNed (Netherlands), enabled: false, collector: external_adapter, website: 'https://www.tenderned.nl', access: public PAPI JSON without authentication; CC0 1.0; date-range cursor; deadline and CPV published}
  - {id: simap_ch, name: simap.ch (Switzerland), enabled: false, collector: external_adapter, website: 'https://www.simap.ch', access: documented OpenAPI without authentication; API terms permit commercial reuse and require attribution, an 08:00 Europe/Zurich publication-day embargo and correction propagation}
  - {id: amtsblattportal, name: Amtsblattportal SHAB (Switzerland), enabled: false, collector: external_adapter, website: 'https://www.amtsblattportal.ch', access: public JSON and bulk XML without authentication; cantonal below-threshold rubrics; no CPV and deadlines are free text}
  - {id: usp_at, name: USP Ausschreibungssuche (Austria), enabled: false, collector: external_adapter, website: 'https://ausschreibungen.usp.gv.at', access: undocumented public JSON list with date filters; detail pages are HTML; national eForms mandatory from 2026-10-01}
  - {id: kerndaten_at, name: Austrian Kerndatenquellen, enabled: false, collector: external_adapter, website: 'https://www.data.gv.at', access: statutory per-authority XML feeds under CC-BY 4.0; published deadline field; source the ANKOE records from USP or BBG because ankoe.at excludes AI crawlers}
  - {id: opentender, name: OpenTender, enabled: false, collector: external_adapter, website: 'https://opentender.eu', access: NOT USABLE - CC BY-NC-SA 4.0 forbids commercial reuse, and Austrian and Swiss coverage ends in 2025}
  - {id: boamp, name: BOAMP (France), enabled: false, collector: external_adapter, website: 'https://boamp-datadila.opendatasoft.com', access: public Opendatasoft v2.1 without authentication; Licence Ouverte/Etalab permits commercial reuse; about 35600 below-threshold notices a year; lifecycle chains on contractfolderid}
  - {id: boamp_dila_xml, name: BOAMP raw XML flow (DILA), enabled: false, collector: external_adapter, website: 'https://echanges.dila.gouv.fr/OPENDATA/BOAMP', access: dated directories of per-notice XML with published schemas; same Etalab licence; authoritative alternative to the flattened API}
  - {id: decp_aife, name: DECP daily drops (AIFE), enabled: false, collector: external_adapter, website: 'https://www.data.gouv.fr/datasets/api-decp', access: Licence Ouverte v2.0; awarded-contract register for incumbent intelligence only - it carries no submission deadline}
  - {id: place_fr, name: PLACE marches-publics.gouv.fr, enabled: false, collector: external_adapter, website: 'https://www.marches-publics.gouv.fr', access: NOT USABLE WITHOUT CLEARANCE - the conditions of use prohibit any reproduction without written authorisation from the publication director; also a rolling window rather than an archive}
  - {id: atexo_regional, name: Atexo regional platforms (France), enabled: false, collector: external_adapter, website: 'https://marches.maximilien.fr', access: Maximilien, Megalis Bretagne and Demat-AMPA share the PLACE/PMP endpoint shape; each platform needs its own terms check}
  - {id: bda_be, name: Bulletin des Adjudications (Belgium), enabled: false, collector: external_adapter, website: 'https://www.publicprocurement.be', access: BLOCKED - the search API needs a bearer token and BOSA claims rights over the data files without granting reuse. Do not mint tokens from the client secret embedded in the site; request a sanctioned route from BOSA}
  - {id: pmp_lu, name: Portail des marches publics (Luxembourg), enabled: false, collector: external_adapter, website: 'https://pmp.b2g.etat.lu', access: public JSON-LD without authentication and the only machine-readable route to Luxembourg below-threshold notices, but the site terms require authorisation for any copy - obtain written MMTP clearance first}
  # Below-threshold coverage for markets TED already serves above threshold.
  - {id: udbud_dk, name: udbud.dk (Denmark), enabled: false, collector: external_adapter, website: 'https://udbud.dk', access: published OpenAPI without authentication; reproduction permitted with attribution and the authority explicitly allows commercial tender intermediaries; true changed-since cursor; notices in Danish and English}
  - {id: kimdis_gr, name: KIMDIS open data (Greece), enabled: false, collector: external_adapter, website: 'https://cerpp.eprocurement.gov.gr', access: public API without authentication under CC BY 4.0; registration is mandatory from 1000 EUR so coverage is deep; 180-day query windows and a documented 350 requests per minute}
  - {id: doffin_no, name: Doffin (Norway), enabled: false, collector: external_adapter, website: 'https://api.doffin.no', access: public search API without authentication with a CPV facet and a sentToTed threshold flag; results capped at 1000 per query; reuse licence not stated}
  - {id: anac_avvisi_it, name: ANAC Pubblicita Legale (Italy), enabled: false, collector: external_adapter, website: 'https://pubblicitalegale.anticorruzione.it', access: public API without authentication carrying large below-threshold volume, but CPV is Italian free text with no numeric code, there is no server-side filtering and no published terms}
  - {id: hilma_fi, name: Hilma (Finland), enabled: false, collector: external_adapter, website: 'https://api.hankintailmoitukset.fi', access: free self-service key and uniquely includes procurement plans, but the terms of use are a contract - they forbid modifying the substantive content of a notice and forbid using personal data for direct marketing}
  - {id: sedia_eu, name: EU Funding and Tenders Portal (SEDIA), enabled: false, collector: external_adapter, website: 'https://ec.europa.eu/info/funding-tenders/opportunities/portal', access: documented public search API reusable under Commission Decision 2011/833/EU; type=0 is calls for tenders and type=1 is grant topics; includes below-threshold ex-ante publicity}
  - {id: etenders_ie, name: eTenders (Ireland), enabled: false, collector: external_adapter, website: 'https://www.etenders.gov.ie', access: undocumented keyless CSV export is the only live route and about 60 per cent of rows are below threshold, but the site publishes no terms and no reuse licence - resolve with the OGP first}
  - {id: dados_gov_pt, name: dados.gov.pt procurement (Portugal), enabled: false, collector: external_adapter, website: 'https://dados.gov.pt', access: keyless bulk announcements with submission deadlines under a public-domain licence, updated weekly; prefer this to base.gov.pt whose terms restrict automated searches}
  - {id: sweden_annonsdatabas, name: Swedish annonsdatabaser, enabled: false, collector: external_adapter, website: 'https://www.konkurrensverket.se', access: NOT AVAILABLE FREE - under Lagen 2019-668 Swedish notices are advertised in privately operated registered databases and all five registered operators are commercial; the regulator publishes annual statistics only}
  - {id: ungm, name: UNGM, enabled: false, collector: external_adapter, website: 'https://www.ungm.org', access: authorised public API or supplier alerts}
